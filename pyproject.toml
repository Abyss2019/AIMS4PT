[build-system]
requires = ["setuptools>=82.0,<82.1", "wheel>=0.46,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "AIMS4PT"
version = "0.2.0"
description = "AIMS4PT codebase for selecting suitable mineral-based thermobarometers, including the AIMS4PT-cpx workflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Xiaoyu Liu" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24,<2.1",
  "pandas>=2.3,<2.4",
  "scipy",
  "matplotlib>=3.8,<3.9",
  "cycler",
  "scikit-learn==1.5.1",
  "openpyxl",
  "xlsxwriter",
  "periodictable",
  "pyrolite>=0.3.6,<0.3.7",
  "seaborn",
  "joblib",
  "xgboost>=3.2,<3.3",
  "tensorflow-cpu>=2.21,<2.22; platform_system == 'Linux' or platform_system == 'Windows'",
  "tensorflow>=2.21,<2.22; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "keras>=3.12,<3.13",
  "rpy2>=3.6,<3.7",
  "onnxruntime",
  "rpy2-robjects",
]

[project.optional-dependencies]
web = [
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
  "cachetools",
  "psutil",
]

dev = [
  "kneed",
  "shap>=0.49,<0.50",
  "ipython",
  "ipykernel",
  "ipywidgets",
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
  "**/*.csv",
  "**/*.html",
  "**/*.css",
  "**/*.js",
  "**/*.xlsx",
  "**/*.xls",
  "**/*.json",
  "**/*.joblib",
  "**/*.onnx",
  "**/*.pkl",
  "**/*.pickle",
  "**/*.txt",
  "**/*.dat",
  "**/*.npy",
  "**/*.npz",
  "**/*.rds",
  "**/*.Rdata",
  "**/*.R",
  "**/*.r",
  "**/*.pb",
  "**/*.index",
  "**/*.data-00000-of-00001",
]
