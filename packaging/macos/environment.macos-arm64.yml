name: aims4pt-macos-arm64
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - pip
  - setuptools>=82.0,<82.1
  - wheel>=0.46,<0.47
  - conda-pack>=0.9.1,<0.10

  # Core numerical and reporting runtime.
  - numpy>=1.24,<2.1
  - pandas>=2.3,<2.4
  - scipy
  - matplotlib>=3.8,<3.9
  - cycler
  - scikit-learn=1.5.1
  - openpyxl
  - xlsxwriter
  - periodictable
  - seaborn
  - joblib
  - py-xgboost>=3.2,<3.3
  - onnxruntime

  # Local web application runtime.
  - fastapi
  - uvicorn
  - jinja2
  - python-multipart
  - cachetools
  - psutil

  # R runtime and packages required by the bundled R-backed models.
  - r-base=4.4.3
  - rpy2>=3.6,<3.7
  - r-performanceanalytics
  - r-rjava
  - r-readxl
  - r-envstats

  # Packages not supplied by the conda environment are installed from PyPI.
  - pip:
      - "tensorflow>=2.21,<2.22"
      - "keras>=3.12,<3.13"
      - "pyrolite>=0.3.6,<0.3.7"
