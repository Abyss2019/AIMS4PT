name: AIMS4PT
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip


  # --- Data / plotting ---
  - numpy>=1.24,<2.1
  - pandas=2.3
  - scipy=1.15
  - matplotlib=3.8
  - seaborn=0.13
  - openpyxl=3.1
  - xlsxwriter=3.2


  # --- ML / statistics (CPU) ---
  - scikit-learn=1.5.1 # version 1.5 to avoid some warnings
  - py-xgboost=3.2=*cpu*
  # R-backed models require rpy2 to be ABI-compatible with R.
  # Keep R pinned to the version used for manuscript reproduction.
  - r-base=4.4.3
  - rpy2=3.6
  - "onnxruntime=*=*cpu*"

  # --- Chemistry ---
  - periodictable=1.7

  # --- Jupyter / optional ---
  - ipykernel
  - ipython

  # --- pip-only packages ---
  - pip:
      - pyrolite
 
